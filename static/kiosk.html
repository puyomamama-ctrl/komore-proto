<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>AI受付</title>
<style>
body{margin:0;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:#0f172a;color:#f8fafc;height:100vh;display:flex;flex-direction:column}
header{padding:14px 18px;font-size:20px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
#staff{background:#334155;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:15px}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:18px;text-align:center}
#mic{width:190px;height:190px;border-radius:50%;border:0;background:#22c55e;color:#04210f;font-size:22px;font-weight:800;box-shadow:0 0 0 0 rgba(34,197,94,.6)}
#mic.rec{background:#ef4444;color:#fff;animation:p 1s infinite}#mic.busy{background:#f59e0b}#mic.speak{background:#38bdf8;color:#052}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(239,68,68,.6)}100%{box-shadow:0 0 0 30px rgba(239,68,68,0)}}
.q{font-size:18px;color:#cbd5e1;min-height:1.4em}.a{font-size:26px;font-weight:700;line-height:1.5;min-height:1.5em}
#standby{position:fixed;inset:0;background:#0f172a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-size:24px}
#standby small{font-size:15px;color:#94a3b8}.dbg{font-size:12px;color:#64748b}
.note{font-size:12px;color:#94a3b8;padding:8px 14px}
</style></head><body>
<header><span id="name">AI受付</span><button id="staff">スタッフを呼ぶ</button></header>
<main>
  <div class="q" id="q"></div>
  <div class="a" id="a">ボタンを押して話しかけてください<br><span style="font-size:16px;color:#94a3b8">Tap and ask in English, too.</span></div>
  <button id="mic">話す</button>
  <div class="dbg" id="dbg"></div>
</main>
<div id="cards" style="display:none;padding:0 16px 8px;max-height:38vh;overflow:auto;font-size:15px;line-height:1.6"></div>
<div class="note">AIがご案内します。音声・会話の内容は保存しません（お答えできなかった質問のみ、個人情報を除いて短期間記録）。音声認識・回答作成は外部のAIサービスで処理されます。料金・時間の最終確認はスタッフへ。</div>
<div id="authwall" style="position:fixed;inset:0;background:#0f172a;z-index:9;display:none;align-items:center;justify-content:center;padding:16px"><div style="background:#fff;color:#0f172a;padding:16px;border-radius:12px;max-width:520px"><h3 style="margin-top:0">店員ログイン（接客を始める）</h3><div id="authbox"></div></div></div>
<div id="standby"><div id="sbname">いらっしゃいませ</div><div>画面をタップしてください</div><small>Tap to start</small></div>
<script src="/static/common.js"></script>
<script>
const slug = location.pathname.split('/').pop();
const P = new URLSearchParams(location.search);
const TTS = P.get('tts') || 'server';          // server(Qwen TTS) | local(端末内蔵の声・無料)
const STT = P.get('stt') || 'server';          // server(Qwen ASR) | browser(Web Speech API)
const IDLE_MS = +(P.get('idle') || 30000);
let session = Math.random().toString(36).slice(2, 10);
const $ = id => document.getElementById(id);
let state = 'idle', idleTimer;
function needLogin() { SK.stopAudio(); $('authwall').style.display = 'flex'; SK.authBox($('authbox'), { slug, onDone: () => { $('authwall').style.display = 'none'; init(); } }); }
function showDegraded(j) {
  $('q').textContent = ''; $('a').textContent = j.message || '現在AI音声が利用できません。スタッフにお声がけください。';
  const c = $('cards'); c.style.display = (j.cards || []).length ? 'block' : 'none';
  c.innerHTML = (j.cards || []).map(x => `<div style="margin-top:8px"><b>${esc(x.title)}</b><br>${x.lines.map(esc).join('<br>')}</div>`).join('');
  if (j.level === 'conv_end') session = Math.random().toString(36).slice(2, 10);   // 次は新しい会話
  setMic('idle'); touch();
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
async function checkStatus() { try { const j = await SK.get(`/api/k/${slug}/status`); if (j.degraded) showDegraded(j); else $('cards').style.display = 'none'; } catch (e) {} }
async function init() { try { await SK.get('/api/me'); checkStatus(); const j = await SK.get(`/api/k/${slug}/info`); $('name').textContent = j.name || 'AI受付'; $('sbname').textContent = `いらっしゃいませ ${j.name || ''}`; } catch (e) { needLogin(); } }
init();
function touch() { clearTimeout(idleTimer); idleTimer = setTimeout(toStandby, IDLE_MS); }
function toStandby() { SK.stopAudio(); speechSynthesis.cancel(); $('q').textContent = ''; $('a').innerHTML = 'ボタンを押して話しかけてください'; $('dbg').textContent = ''; $('standby').style.display = 'flex'; setMic('idle'); }
$('standby').onclick = () => { SK.ensureCtx(); $('standby').style.display = 'none'; touch(); };
function setMic(s) { state = s; const m = $('mic'); m.className = { rec: 'rec', busy: 'busy', speak: 'speak' }[s] || ''; m.textContent = { idle: '話す', rec: '聞いています…\n(タップで終了)', busy: '考えています…', speak: '話しています\n(タップで割り込み)' }[s]; }
$('staff').onclick = () => { touch(); if ($('cards').style.display === 'none') $('a').textContent = 'スタッフをお呼びしています。少々お待ちください。'; SK.post(`/api/k/${slug}/staff`, { session }).catch(needLogin); };
function browserSTT() { return new Promise((res, rej) => { const R = window.SpeechRecognition || window.webkitSpeechRecognition; if (!R) return rej(new Error('このブラウザは音声認識非対応')); const r = new R(); r.lang = P.get('lang') || 'ja-JP'; r.onresult = e => res(e.results[0][0].transcript); r.onerror = e => rej(new Error(e.error)); r.onend = () => res(''); r.start(); SK.stopRec = () => r.stop(); }); }
$('mic').onclick = async () => {
  touch();
  if (state === 'rec') { SK.stopRec && SK.stopRec(); return; }
  if (state === 'busy') return;
  if (state === 'speak') { SK.stopAudio(); speechSynthesis.cancel(); }   // 割り込み
  setMic('rec'); $('q').textContent = ''; $('a').textContent = '';
  try {
    let body = { session, mode: 'kiosk' }, tEnd;
    if (STT === 'browser') { const text = await browserSTT(); tEnd = performance.now(); body.text = text; body.client_stt = true; }
    else { const r = await SK.record(); tEnd = r.endedAt; if (!r.spoke) { setMic('idle'); $('a').textContent = '聞き取れませんでした。もう一度どうぞ。'; return; } body.audio_b64 = r.b64; body.mime = r.mime; }
    setMic('busy');
    const j = await SK.post(`/api/k/${slug}/ask`, body);
    if (j.degraded) return showDegraded(j);
    $('cards').style.display = 'none';
    $('q').textContent = '「' + j.question + '」'; $('a').textContent = j.answer; touch();
    const tText = performance.now();
    setMic('speak');
    let tFirst = null;
    if (TTS === 'local') { tFirst = performance.now(); await SK.speakLocal(j.answer, j.lang); }
    else await SK.playPcmStream(`/api/k/${slug}/tts`, { tts_token: j.tts_token }, t => tFirst = t);
    if (P.get('debug')) $('dbg').textContent = `文字表示まで ${Math.round(tText - tEnd)}ms / 音声開始まで ${Math.round((tFirst||tText) - tEnd)}ms / ASR ${j.timings.asr_ms} LLM ${j.timings.llm_ms} / ${j.status}`;
    if (state === 'speak') setMic('idle'); touch();
  } catch (e) { setMic('idle'); if (e.status === 401) return needLogin(); if (e.status === 429) { $('a').textContent = e.message; return; } if (e.name !== 'AbortError') $('a').textContent = 'エラー: ' + e.message; }
};
document.body.addEventListener('pointerdown', touch);
toStandby();
</script></body></html>
